<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Status</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Center */
        .agent-status-title {
            margin-top: 40px;
            font-size: 28px;
            font-weight: 700;
            color: #222;
        }

        /* Dropdown */
        .agentStatusControls {
            margin-top: 15px;
            padding: 12px 18px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }

        /* Center Status Box */
        .status-box {
            margin-top: 100px;
            min-width: 280px;
            padding: 35px 50px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .status-label {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
        }

        .selected-status {
            font-size: 30px;
            font-weight: 700;
            color: #222;
        }
    </style>
</head>

<body>

    <div class="agent-status-title">
        Agent Status
    </div>

    <select class="agentStatusControls" id="agentStatus">
        <option value="Available">Available</option>
        <option value="Case Break">Case Break</option>
        <option value="Lunch">Lunch</option>
        <option value="Meeting">Meeting</option>
        <option value="Coaching">Coaching</option>
        <option value="Offline">Offline</option>
        <option value="Not Ready">Not Ready</option>
    </select>

    <div class="status-box">
        <div class="status-label">CURRENT STATUS</div>
        <div class="selected-status" id="selectedStatus">
            Available
        </div>
    </div>

    <script>
        const dropdown = document.querySelector(".agentStatusControls");
        const selectedStatus = document.getElementById("selectedStatus");

        dropdown.addEventListener("change", function () {
            selectedStatus.textContent = this.value;
        });
    </script>

</body>
</html>
